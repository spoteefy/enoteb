<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Xem trước tài liệu - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "surface-dark": "#101622",
                        "panel-dark": "#1c2533",
                        "border-dark": "#2d3748",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-surface-dark font-sans text-slate-200 min-h-screen flex flex-col overflow-hidden">
<header class="h-14 border-b border-border-dark bg-panel-dark flex items-center justify-between px-4 z-50">
<div class="flex items-center gap-4">
<button onclick="history.back()" class="p-2 hover:bg-white/5 rounded-lg text-slate-400 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 id="source-name" class="text-sm font-semibold text-white leading-tight">Document.pdf</h1>
<p class="text-[11px] text-slate-400">Trình xem tài liệu</p>
</div>
</div>
<div class="flex items-center gap-3">
<button class="flex items-center gap-2 px-3 py-1.5 hover:bg-white/5 rounded-lg text-slate-300 transition-colors text-sm">
<span class="material-symbols-outlined text-[20px]">file_download</span>
<span>Tải về</span>
</button>
<button onclick="history.back()" class="w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-lg text-slate-400 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</header>
<main class="flex-1 flex overflow-hidden">
<div class="flex-1 bg-surface-dark overflow-y-auto p-10 flex flex-col items-center">
    <div class="w-full max-w-4xl bg-white text-slate-900 min-h-[1000px] p-16 shadow-2xl rounded-sm">
        <h2 class="text-3xl font-bold mb-8">Nội dung tài liệu</h2>
        <p class="text-lg leading-relaxed text-slate-700">Đây là bản xem trước của tài liệu. Trong ứng dụng thực tế, PDF sẽ được hiển thị ở đây thông qua một trình xem PDF chuyên dụng.</p>
    </div>
</div>
<aside class="w-80 border-l border-border-dark bg-panel-dark flex flex-col">
<div class="p-4 border-b border-border-dark flex items-center justify-between">
<h3 class="font-bold text-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">edit_note</span>
                    Ghi chú nhanh
                </h3>
</div>
<div class="flex-1 flex flex-col p-4 gap-4">
    <textarea class="flex-1 w-full bg-surface-dark border border-border-dark rounded-lg p-3 text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none resize-none" placeholder="Nhập suy nghĩ của bạn..."></textarea>
</div>
<div class="p-4 bg-surface-dark/30 border-t border-border-dark">
<button onclick="alert('Đã lưu!')" class="w-full bg-primary hover:bg-primary/90 text-white text-sm font-bold py-2.5 rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">save</span>
                    Lưu ghi chú
                </button>
</div>
</aside>
</main>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name');
    if (name) document.querySelector('#source-name').textContent = name;
</script>
</body></html>

<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Xem trước &amp; Trích dẫn tài liệu - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "surface-dark": "#101622",
                        "panel-dark": "#1c2533",
                        "border-dark": "#2d3748",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pdf-page-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 10px;
        }
        .highlight-area {
            background-color: rgba(19, 91, 236, 0.3);
            border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-surface-dark font-sans text-slate-200 min-h-screen flex flex-col overflow-hidden">
<header class="h-14 border-b border-border-dark bg-panel-dark flex items-center justify-between px-4 z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-white/5 rounded-lg text-slate-400 transition-colors">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="flex flex-col">
<h1 id="docName" class="text-sm font-semibold text-white leading-tight">Báo cáo Xu hướng AI 2024.pdf</h1>
<p id="docMeta" class="text-[11px] text-slate-400">Trình xem tài liệu • 12.4 MB</p>
</div>
</div>
<div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 bg-slate-900/50 p-1 rounded-lg border border-border-dark">
<div class="flex items-center gap-1 px-2 border-r border-border-dark">
<button class="p-1 hover:bg-white/10 rounded transition-colors"><span class="material-symbols-outlined text-sm">keyboard_arrow_left</span></button>
<input class="w-8 h-7 bg-surface-dark border border-border-dark text-[12px] text-center rounded p-0 focus:ring-1 focus:ring-primary outline-none" type="text" value="3"/>
<span class="text-xs text-slate-500 mx-1">/ 42</span>
<button class="p-1 hover:bg-white/10 rounded transition-colors"><span class="material-symbols-outlined text-sm">keyboard_arrow_right</span></button>
</div>
<div class="flex items-center gap-1 px-2">
<button class="p-1 hover:bg-white/10 rounded transition-colors"><span class="material-symbols-outlined text-sm">remove</span></button>
<span class="text-xs text-slate-300 w-12 text-center">125%</span>
<button class="p-1 hover:bg-white/10 rounded transition-colors"><span class="material-symbols-outlined text-sm">add</span></button>
</div>
</div>
<div class="flex items-center gap-3">
<button class="flex items-center gap-2 px-3 py-1.5 hover:bg-white/5 rounded-lg text-slate-300 transition-colors text-sm">
<span class="material-symbols-outlined text-[20px]">file_download</span>
<span>Tải về</span>
</button>
<button id="closePreview" class="w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-lg text-slate-400 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</header>
<main class="flex-1 flex overflow-hidden">
<div class="flex-1 bg-surface-dark overflow-y-auto custom-scrollbar p-10 flex flex-col items-center relative">
<div class="w-full max-w-4xl bg-white text-slate-900 min-h-[1200px] p-16 relative pdf-page-shadow rounded-sm">
<div id="docContent" class="space-y-6">
    <!-- Document content will be rendered here -->
    <h2 class="text-3xl font-bold text-slate-900 mb-8">Nội dung tài liệu</h2>
    <p class="text-base leading-relaxed text-slate-700">Đang tải nội dung...</p>
</div>
</div>
</div>
<aside class="w-80 border-l border-border-dark bg-panel-dark flex flex-col">
<div class="p-4 border-b border-border-dark flex items-center justify-between">
<h3 class="font-bold text-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">edit_note</span>
                    Ghi chú nhanh
                </h3>
<button class="p-1.5 hover:bg-white/10 rounded transition-colors">
<span class="material-symbols-outlined text-sm">settings</span>
</button>
</div>
<div class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto custom-scrollbar">
<div id="activeCitation" class="hidden bg-surface-dark/50 border border-primary/30 rounded-lg p-3 space-y-2 relative overflow-hidden group">
<div class="absolute left-0 top-0 w-1 h-full bg-primary"></div>
<div class="flex justify-between items-start">
<span class="text-[10px] uppercase tracking-wider text-primary font-bold">Đang trích dẫn</span>
<button id="removeCitation" class="text-slate-500 hover:text-red-400"><span class="material-symbols-outlined text-sm">delete</span></button>
</div>
<p id="citationText" class="text-xs italic text-slate-400 line-clamp-3"></p>
<div class="text-[10px] text-slate-500" id="citationSource"></div>
</div>
<div class="flex-1 flex flex-col">
<label class="text-[11px] text-slate-500 font-medium mb-1 uppercase tracking-widest px-1">Ý tưởng của bạn</label>
<textarea id="noteTextarea" class="flex-1 w-full bg-surface-dark border border-border-dark rounded-lg p-3 text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none resize-none placeholder:text-slate-600" placeholder="Nhập suy nghĩ của bạn về đoạn văn này..."></textarea>
</div>
<div class="space-y-2">
<p class="text-[11px] text-slate-500 font-medium uppercase tracking-widest px-1">Gợi ý chủ đề</p>
<div class="flex flex-wrap gap-2">
<span class="px-2 py-1 bg-white/5 border border-border-dark rounded text-[10px] text-slate-400 cursor-pointer hover:border-primary/50 hover:text-primary transition-all">#GenerativeAI</span>
<span class="px-2 py-1 bg-white/5 border border-border-dark rounded text-[10px] text-slate-400 cursor-pointer hover:border-primary/50 hover:text-primary transition-all">#LLM</span>
<span class="px-2 py-1 bg-white/5 border border-border-dark rounded text-[10px] text-slate-400 cursor-pointer hover:border-primary/50 hover:text-primary transition-all">#Trends2024</span>
</div>
</div>
</div>
<div class="p-4 bg-surface-dark/30 border-t border-border-dark">
<button id="saveNoteBtn" class="w-full bg-primary hover:bg-primary/90 text-white text-sm font-bold py-2.5 rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">save</span>
                    Lưu ghi chú
                </button>
</div>
</aside>
</main>
<footer class="h-8 bg-surface-dark border-t border-border-dark flex items-center px-4 justify-between text-[11px] text-slate-500">
<div class="flex items-center gap-4">
<span>Kho Tri Thức Personal Knowledge Base</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">history</span> Tự động lưu lúc 14:20</span>
</div>
<div class="flex items-center gap-3">
<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> Trực tuyến</span>
<span>v2.4.0-stable</span>
</div>
</footer>

<script src="js/preview.js"></script>
</body></html>

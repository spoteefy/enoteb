<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tìm kiếm nâng cao &amp; Phân tích AI - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "surface-dark": "#1e293b",
                        "border-dark": "#334155"
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ai-gradient {
            background: linear-gradient(135deg, #135bec 0%, #4f46e5 100%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-border-dark px-6 h-16 flex items-center justify-between">
<div class="flex items-center gap-8">
<div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/dashboard.html'">
<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">database</span>
</div>
<span class="font-bold text-xl tracking-tight">Kho Tri Thức</span>
</div>
<div class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-400">
<a class="hover:text-primary transition-colors" href="/dashboard.html">Trang chủ</a>
<a class="text-primary" href="#">Tìm kiếm</a>
</div>
</div>
</nav>
<main class="max-w-[1440px] mx-auto p-6 flex flex-col gap-6">
<div class="flex flex-col gap-6">
<div class="relative group">
<input id="search-input" class="w-full h-16 pl-14 pr-32 bg-white dark:bg-surface-dark border-2 border-slate-200 dark:border-border-dark focus:border-primary dark:focus:border-primary rounded-2xl text-xl font-medium shadow-sm transition-all outline-none" placeholder="Tìm kiếm tài liệu, kiến thức..." type="text"/>
<div class="absolute inset-y-0 right-3 flex items-center">
<button id="search-btn" class="bg-primary text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-blue-600 transition-all shadow-lg shadow-primary/20">
                        Tìm kiếm
                    </button>
</div>
</div>
</div>
<div class="grid grid-cols-12 gap-6 items-start">
<div class="col-span-12 lg:col-span-7 flex flex-col gap-4">
    <div id="results-container">
        <!-- Results here -->
    </div>
</div>
<div class="col-span-12 lg:col-span-5 sticky top-24">
<div class="bg-white dark:bg-surface-dark rounded-2xl border border-slate-200 dark:border-border-dark shadow-xl overflow-hidden">
<div class="ai-gradient p-5 text-white">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined">auto_awesome</span>
<h3 class="font-bold text-lg">Phân tích từ AI</h3>
</div>
</div>
<p id="ai-summary" class="text-white/90 text-sm leading-relaxed">
    Nhập từ khóa và nhấn tìm kiếm để AI phân tích...
</p>
</div>
</div>
</div>
</div>
</main>
<script>
    const token = localStorage.getItem('token');
    document.querySelector('#search-btn').onclick = async () => {
        const query = document.querySelector('#search-input').value;
        if (!query) return;

        const res = await fetch('/api/ai/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ query })
        });
        const data = await res.json();
        document.querySelector('#ai-summary').textContent = data.summary;
    };
</script>
</body></html>

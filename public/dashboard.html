<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kho Tri Thức - Dashboard & Drive</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.4rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-sidebar {
            @apply bg-white/60 dark:bg-slate-900/60 backdrop-blur-2xl border-r border-white/20 dark:border-slate-800/50;
        }
        .active-glass-item {
            @apply bg-primary/20 border border-primary/30 text-primary font-bold shadow-[0_0_15px_rgba(19,91,236,0.2)] backdrop-blur-lg;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="flex h-16 items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-6 sticky top-0 z-50">
<div class="flex items-center gap-8 flex-1">
<div class="flex items-center gap-3">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary/30">
<span class="material-symbols-outlined">auto_awesome</span>
</div>
<h2 class="text-lg font-bold tracking-tight">Kho Tri Thức</h2>
</div>
<div class="flex-1 max-w-xl">
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input id="searchInput" class="block w-full rounded-lg border-0 py-2 pl-10 bg-slate-100/80 dark:bg-slate-800/80 focus:ring-2 focus:ring-primary text-sm placeholder-slate-500 transition-all" placeholder="Tìm kiếm tài liệu, ghi chú, thẻ..." type="text"/>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<button id="uploadBtn" class="flex items-center gap-2 px-4 h-10 bg-primary hover:bg-primary/90 text-white rounded-lg text-sm font-bold transition-all shadow-md active:scale-95">
<span class="material-symbols-outlined text-[20px]">upload</span>
<span>Tải lên</span>
</button>
<input type="file" id="fileInput" class="hidden" multiple accept=".pdf,.docx,.md,.txt"/>
<div class="h-10 w-px bg-slate-200 dark:bg-slate-800 mx-2"></div>
<button id="notificationBtn" class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
<div class="size-9 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden ring-2 ring-slate-100 dark:ring-slate-800 shadow-sm cursor-pointer" id="userProfileBtn">
<img id="userAvatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApiVybfes8Xums_oQ64FbbLBUPS368do7skYSxQA1oFqch3sQsjjVxFFiGGvSYUhK1crAfD1gPIo6YKAmTnIWYyi_ul9sj_vRI1tlbJZeGTcW6s1eMX0VlVGRxlTdk_oZAQ80l3E10R0-mkulwRKPwateDhvgNFIdQBHxVVxNEWAAvZ4ZCMCEOhBTCQLkMmyG78Xa_BebodSTzquDyUxpxnjjs8okGpNAv2VIL-UPl9dU--u67P2JuNYSSPXllZwS36AHficRG8k4J"/>
</div>
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<aside class="w-64 glass-sidebar flex flex-col justify-between py-6 z-40">
<div class="px-4 flex flex-col gap-1.5">
<button id="driveTab" class="flex items-center gap-3 px-3 py-2.5 rounded-lg active-glass-item text-sm transition-all w-full text-left">
<span class="material-symbols-outlined">database</span>
<span>Lưu trữ (Drive)</span>
</button>
<button id="notebooksTab" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/40 dark:hover:bg-white/5 text-slate-700 dark:text-slate-300 text-sm font-medium transition-all w-full text-left">
<span class="material-symbols-outlined">menu_book</span>
<span>Notebooks</span>
</button>
<a href="trash.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/40 dark:hover:bg-white/5 text-slate-600 dark:text-slate-400 text-sm font-medium transition-all">
<span class="material-symbols-outlined">delete</span>
<span>Thùng rác</span>
</a>
</div>
</aside>
<main class="flex-1 flex flex-col overflow-y-auto bg-transparent p-8">
    <!-- Drive Section -->
    <section id="driveSection" class="space-y-8">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">Lưu trữ của tôi</h1>
            <button id="createCategoryBtn" class="flex items-center gap-2 px-4 py-2 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">
                <span class="material-symbols-outlined text-sm">add</span>
                Danh mục mới
            </button>
        </div>
        <div id="driveContent" class="space-y-8"></div>
    </section>

    <!-- Notebooks Section -->
    <section id="notebooksSection" class="hidden space-y-8">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">Notebooks</h1>
            <button id="createNotebookBtn" class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold">
                <span class="material-symbols-outlined text-sm">add</span>
                Notebook mới
            </button>
        </div>
        <div id="notebooksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </section>
</main>
</div>

<!-- Quick Create Notebook Modal -->
<div id="quickCreateModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="relative w-full max-w-xl bg-slate-900 border border-slate-800 shadow-2xl rounded-2xl p-6">
        <h2 class="text-xl font-bold text-white mb-4">Tạo Notebook mới</h2>
        <input id="newNbName" class="w-full bg-slate-800 border-slate-700 rounded-lg h-12 px-4 text-white mb-4" placeholder="Tên Notebook"/>
        <textarea id="newNbDesc" class="w-full bg-slate-800 border-slate-700 rounded-lg p-4 text-white mb-4" placeholder="Mô tả"></textarea>
        <div class="flex justify-end gap-2">
            <button id="closeQuickCreate" class="px-4 py-2 text-slate-400">Hủy</button>
            <button id="confirmQuickCreate" class="px-6 py-2 bg-primary text-white rounded-lg font-bold">Tạo</button>
        </div>
    </div>
</div>

<!-- Notification Center -->
<div id="notificationModal" class="hidden fixed top-20 right-6 z-[110] w-full max-w-md bg-white/10 dark:bg-black/40 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-2xl rounded-2xl overflow-hidden animate-in fade-in slide-in-from-right-4 duration-300">
    <div class="p-6 border-b border-white/10 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">notifications</span>
                Thông báo
            </h2>
            <p class="text-white/40 text-xs mt-1">Bạn có 3 thông báo mới</p>
        </div>
        <button id="closeNotifications" class="p-2 rounded-full hover:bg-white/10 text-white/60 transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>
    <div class="max-h-[400px] overflow-y-auto p-4 space-y-2" id="notificationList">
        <!-- Notifications will be injected here -->
        <div class="p-4 bg-white/5 rounded-xl border border-white/10">
            <p class="text-sm font-semibold text-white">AI đã hoàn thành phân tích</p>
            <p class="text-xs text-white/60">Báo cáo nghiên cứu của bạn đã sẵn sàng.</p>
        </div>
    </div>
</div>

<!-- Upload Progress Modal -->
<div id="uploadProgressModal" class="hidden fixed bottom-6 right-6 z-[110] w-full max-w-[380px] bg-white/70 dark:bg-[#1c2533]/60 backdrop-blur-xl border border-white/20 dark:border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
    <div class="px-5 py-4 border-b border-slate-200/50 dark:border-white/5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-primary/20 flex items-center justify-center">
                <span class="material-symbols-outlined text-primary text-xl">cloud_upload</span>
            </div>
            <h3 class="font-bold text-[14px] text-slate-800 dark:text-white leading-tight">Đang tải lên...</h3>
        </div>
        <button id="closeUploadProgress" class="p-1.5 hover:bg-slate-100 dark:hover:bg-white/10 rounded-lg text-slate-400">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>
    <div class="p-4 space-y-4" id="uploadList">
        <div class="space-y-2">
            <div class="flex justify-between text-xs">
                <span class="text-slate-700 dark:text-slate-200 truncate">Document.pdf</span>
                <span class="font-bold text-primary">75%</span>
            </div>
            <div class="w-full bg-slate-200/50 dark:bg-white/10 h-1.5 rounded-full overflow-hidden">
                <div class="bg-primary h-full rounded-full" style="width: 75%"></div>
            </div>
        </div>
    </div>
</div>

<!-- Multi-select Bar -->
<div id="multiSelectBar" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-[60] animate-in fade-in slide-in-from-bottom-4 duration-300">
<div class="flex items-center gap-6 px-6 py-3 bg-slate-900/90 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl ring-1 ring-white/10">
<div class="flex items-center gap-3 pr-6 border-r border-slate-700/50">
<span id="selectedCount" class="flex items-center justify-center size-6 bg-primary rounded text-[12px] font-bold text-white">0</span>
<span class="text-sm font-medium text-slate-200">Đã chọn</span>
</div>
<div class="flex items-center gap-2">
<button id="multiAddToNotebook" class="flex items-center gap-2 px-4 py-2 rounded-xl hover:bg-white/5 text-slate-300 hover:text-white transition-all">
<span class="material-symbols-outlined text-[20px] text-primary">add_box</span>
<span class="text-sm font-medium">Thêm vào Notebook</span>
</button>
<button id="multiQuickAnalysis" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary/20 hover:bg-primary/30 text-primary-400 border border-primary/30 hover:border-primary/50 transition-all">
<span class="material-symbols-outlined text-[20px] text-primary">auto_fix</span>
<span class="text-sm font-bold text-white">Phân tích nhanh</span>
</button>
<button id="clearSelection" class="flex items-center justify-center size-9 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
</div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body></html>

<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quản lý Thùng rác - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0f172a",
                        "sidebar-dark": "#1e293b",
                        "card-dark": "#1e293b",
                        "border-dark": "#334155"
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .sidebar-item-active {
                @apply bg-primary/10 text-primary border-r-2 border-primary;
            }
        }
        .item-row:hover .action-buttons {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex h-screen overflow-hidden">
<aside class="w-64 bg-white dark:bg-sidebar-dark border-r border-slate-200 dark:border-border-dark flex flex-col shrink-0">
<div class="p-6 flex items-center gap-3 cursor-pointer" onclick="window.location.href='/dashboard.html'">
<div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">database</span>
</div>
<span class="font-bold text-xl tracking-tight">Kho Tri Thức</span>
</div>
<nav class="flex-1 px-3 space-y-1">
<a class="flex items-center gap-3 px-3 py-2.5 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors" href="/dashboard.html">
<span class="material-symbols-outlined">home</span>
<span class="text-sm font-medium">Trang chủ</span>
</a>
<a class="flex items-center gap-3 px-3 py-2.5 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined">folder</span>
<span class="text-sm font-medium">Tài liệu của tôi</span>
</a>
<div class="pt-4 pb-2 px-3">
<p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Hệ thống</p>
</div>
<a class="flex items-center gap-3 px-3 py-2.5 sidebar-item-active rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">delete</span>
<span class="text-sm font-semibold">Thùng rác</span>
</a>
<a class="flex items-center gap-3 px-3 py-2.5 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors" href="/settings.html">
<span class="material-symbols-outlined">settings</span>
<span class="text-sm font-medium">Cài đặt</span>
</a>
</nav>
</aside>
<main class="flex-1 flex flex-col overflow-hidden">
<header class="h-16 border-b border-slate-200 dark:border-border-dark bg-white dark:bg-background-dark px-8 flex items-center justify-between shrink-0">
<div class="flex items-center gap-4">
<h2 class="text-lg font-bold">Thùng rác</h2>
<span id="trash-count" class="bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-xs px-2 py-0.5 rounded-full">0 mục</span>
</div>
</header>
<div class="flex-1 overflow-y-auto p-8">
<div class="bg-white dark:bg-card-dark border border-slate-200 dark:border-border-dark rounded-xl overflow-hidden">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-border-dark">
<th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500">Tên mục</th>
<th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-500 w-24">Hành động</th>
</tr>
</thead>
<tbody id="trash-container" class="divide-y divide-slate-200 dark:divide-border-dark">
    <!-- Trash items here -->
</tbody>
</table>
</div>
</div>
</main>
</div>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/trash', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const items = await res.json();
        document.querySelector('#trash-count').textContent = `${items.length} mục`;
        const container = document.querySelector('#trash-container');
        items.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "item-row hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors group";
            tr.innerHTML = `
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-blue-500">description</span>
                        <span class="text-sm font-medium">Item ${item.item_id} (${item.item_type})</span>
                    </div>
                </td>
                <td class="px-6 py-4 text-right">
                    <div class="action-buttons opacity-0 flex items-center gap-2 transition-opacity">
                        <button onclick="permanentDelete(${item.id})" class="p-1.5 hover:bg-red-100 dark:hover:bg-red-900/30 text-red-500 rounded-md" title="Xóa vĩnh viễn">
                            <span class="material-symbols-outlined text-xl">delete_forever</span>
                        </button>
                    </div>
                </td>
            `;
            container.appendChild(tr);
        });
    });

    async function permanentDelete(id) {
        const token = localStorage.getItem('token');
        await fetch(`/api/trash/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        location.reload();
    }
</script>
</body></html>

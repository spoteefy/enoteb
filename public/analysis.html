<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Phân tích nhanh đa tài liệu AI - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0a0f1a",
                        "surface-dark": "#161c2d",
                        "border-dark": "#2d3748"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ai-gradient-bg {
            background: linear-gradient(135deg, rgba(19, 91, 236, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
        }
        .ai-border-glow {
            box-shadow: 0 0 20px rgba(19, 91, 236, 0.15);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background-dark font-display text-slate-200 min-h-screen overflow-hidden">
<div class="fixed inset-0 z-0 opacity-20 pointer-events-none grayscale">
<div class="p-8 grid grid-cols-4 gap-6">
<div class="h-64 bg-surface-dark border border-border-dark rounded-xl p-4">
<div class="h-4 w-1/2 bg-slate-700 rounded mb-4"></div>
<div class="space-y-2">
<div class="h-2 w-full bg-slate-800 rounded"></div>
<div class="h-2 w-full bg-slate-800 rounded"></div>
<div class="h-2 w-3/4 bg-slate-800 rounded"></div>
</div>
</div>
</div>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
<div class="w-full max-w-5xl bg-surface-dark border border-border-dark rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden ai-border-glow">
<div class="px-8 py-5 border-b border-border-dark flex items-center justify-between bg-surface-dark/50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary/10 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary">auto_awesome</span>
</div>
<div>
<h2 class="text-xl font-bold text-white tracking-tight">Phân tích nhanh đa tài liệu AI</h2>
<p id="analysisMeta" class="text-xs text-slate-400">Đang phân tích tài liệu...</p>
</div>
</div>
<button onclick="history.back()" class="text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<div class="flex-1 overflow-y-auto custom-scrollbar">
<div class="p-8 space-y-8">
<div id="sourceList" class="flex flex-wrap gap-2">
    <!-- Sources injected here -->
</div>
<section class="ai-gradient-bg p-6 rounded-xl border border-primary/20">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary">summarize</span>
<h3 class="font-bold text-lg text-white">Tổng quan tri thức</h3>
</div>
<p id="summaryText" class="text-slate-300 leading-relaxed">
    Đang khởi tạo AI...
</p>
</section>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
<section class="space-y-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-indigo-400">category</span>
<h3 class="font-bold text-lg text-white">Các chủ đề chính</h3>
</div>
<div id="topicsList" class="space-y-3">
    <!-- Topics injected here -->
</div>
</section>
<section class="space-y-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-emerald-400">tips_and_updates</span>
<h3 class="font-bold text-lg text-white">Gợi ý hành động</h3>
</div>
<ul id="actionsList" class="space-y-3">
    <!-- Actions injected here -->
</ul>
</section>
</div>
</div>
</div>
<div class="px-8 py-6 border-t border-border-dark bg-slate-900/50 flex flex-col sm:flex-row items-center justify-between gap-4">
<div class="flex items-center gap-2 text-slate-400 text-sm italic">
<span class="material-symbols-outlined text-sm">info</span>
                    Phân tích được thực hiện bởi mô hình AI cao cấp
                </div>
<div class="flex items-center gap-3 w-full sm:w-auto">
<button class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-6 h-11 border border-border-dark rounded-lg text-sm font-semibold text-slate-300 hover:bg-slate-800 transition-all">
<span class="material-symbols-outlined text-xl">note_add</span>
                        Lưu thành ghi chú mới
                    </button>
<button class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-6 h-11 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90 transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-xl">auto_stories</span>
                        Tạo Notebook từ đây
                    </button>
</div>
</div>
</div>
</div>

<script src="js/analysis.js"></script>
</body></html>

<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hướng dẫn sử dụng - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0a0f18",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex items-center justify-center p-0 m-0 overflow-hidden">
<main class="relative z-10 w-full max-w-6xl mx-auto px-6 h-full flex flex-col items-center justify-center">
<div class="glass w-full rounded-2xl overflow-hidden flex flex-col lg:flex-row shadow-2xl min-h-[600px]">
<div class="lg:w-1/2 p-8 lg:p-16 flex flex-col justify-center gap-8">
<div class="flex items-center gap-2 mb-4">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-white">database</span>
</div>
<span class="font-bold text-2xl tracking-tight">Kho Tri Thức</span>
</div>
<div class="space-y-4">
<h1 class="text-4xl lg:text-5xl font-black leading-tight tracking-tight">
                        Xây dựng Kho <br/>
<span class="text-primary">Tri Thức</span> của bạn
                    </h1>
<p class="text-slate-600 dark:text-slate-400 text-lg leading-relaxed max-w-md">
                        Bắt đầu bằng cách tải lên các tài liệu quan trọng. AI của chúng tôi sẽ tự động phân tích và sắp xếp thông tin để bạn dễ dàng tra cứu sau này.
                    </p>
</div>
<div class="flex items-center gap-4 mt-8 pt-8 border-t border-slate-200 dark:border-white/10">
<button onclick="window.location.href='/dashboard.html'" class="bg-primary hover:bg-primary/90 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg shadow-primary/25 flex items-center gap-2">
                        Tiếp tục
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
</body></html>

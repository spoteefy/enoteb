<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cài đặt Tài khoản &amp; Bảo mật - Kho Tri Thức</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0f172a",
                        "panel-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sidebar-glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item-active {
            @apply bg-primary/10 text-primary border-r-2 border-primary;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">
<aside class="w-72 sidebar-glass hidden lg:flex flex-col sticky top-0 h-screen">
<div class="p-8">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white">database</span>
</div>
<span class="font-bold text-xl tracking-tight">Kho Tri Thức</span>
</div>
</div>
<nav id="settingsNav" class="flex-1 px-4 flex flex-col gap-1">
<p class="px-4 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Cài đặt hệ thống</p>
<button data-tab="profile" class="flex items-center gap-3 px-4 py-3 rounded-lg nav-item-active transition-all w-full text-left">
<span class="material-symbols-outlined">person</span>
<span class="font-medium text-sm">Hồ sơ cá nhân</span>
</button>
<button data-tab="security" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all w-full text-left">
<span class="material-symbols-outlined">security</span>
<span class="font-medium text-sm">Bảo mật</span>
</button>
<button data-tab="sessions" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all w-full text-left">
<span class="material-symbols-outlined">devices</span>
<span class="font-medium text-sm">Phiên đăng nhập</span>
</button>
<div class="mt-8">
<p class="px-4 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Ứng dụng</p>
<a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-medium text-sm">Bảng điều khiển</span>
</a>
</div>
</nav>
<div class="p-6 mt-auto border-t border-white/5">
<div class="flex items-center gap-3 px-2">
<img id="sideAvatar" alt="User avatar" class="w-10 h-10 rounded-full border border-white/10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6jK3c1wDbKeU-skDm16igSAh6yO0kygH5xkmo_4ccDHaF97grmVr-MMDX_4uuVvqu4loVXZ97QbsR-wHgij_RzssIGyI4D0gr5qNs2TjB-NKidCjr6rDBK0GfS6jMm_C7bDDbU9oHb9DMbF678ZABcnJSsWm4Ami0JHSvq_y0ryfokxqRSbwfd6EQx_cl97lh_N2-9CuEj2QTRK2CL55BG6OFmMPABGEVkc-xw55CBmwVYetzHnacN0DMzENbhBM8D3H4vl5bhGnC"/>
<div class="flex flex-col">
<span id="sideName" class="text-sm font-semibold truncate">Nguyễn Văn A</span>
<span id="sidePlan" class="text-xs text-slate-500 truncate">Pro Member</span>
</div>
<button id="logoutBtn" class="ml-auto text-slate-500 hover:text-red-400">
<span class="material-symbols-outlined text-lg">logout</span>
</button>
</div>
</div>
</aside>
<main id="settingsContent" class="flex-1 overflow-y-auto">
    <!-- Content injected based on active tab -->
</main>
</div>

<script src="js/settings.js"></script>
</body></html>
